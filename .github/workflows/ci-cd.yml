name: HMS CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAIN_CLASS: Login
  APP_NAME: hospital-management-system

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Show toolchain
        run: |
          java -version
          javac -version

      - name: Build
        run: |
          mkdir -p out/main out/test
          find . -name "*.java" ! -name "PatientTest.java" > sources.txt
          javac -Xlint:all -d out/main @sources.txt
          javac -cp out/main -d out/test PatientTest.java

      - name: Run automated tests
        shell: bash
        run: |
          java -Djava.awt.headless=true -cp out/main:out/test PatientTest | tee test-results.txt

      - name: Publish test summary
        if: always()
        run: |
          echo '### Test results' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat test-results.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      - name: Package JAR
        run: |
          mkdir -p dist
          jar --create --file "dist/$APP_NAME.jar" --main-class "$MAIN_CLASS" -C out/main .

      - name: Smoke test the JAR
        run: java -jar "dist/$APP_NAME.jar" | grep "Login Screen"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hms-jar
          path: dist/*.jar

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  deploy-development:
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hms-jar
      - name: Deploy to development
        run: echo "Development build ready:" && ls -l *.jar

  deploy-production:
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hms-jar
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" *.jar \
            --repo "${{ github.repository }}" \
            --title "Hospital Management System v${{ github.run_number }}" \
            --generate-notes
